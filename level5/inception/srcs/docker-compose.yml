name: inception

services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb:inception
    env_file: .env
    networks:
      - inception_net
    volumes:
      - mariadb_data:/var/lib/mysql:rw
    secrets:
      - db_password
      - db_root_password
    restart: unless-stopped

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress:inception
    env_file: .env
    depends_on:
      - mariadb
    networks:
      - inception_net
    volumes:
      - wordpress_data:/var/www/html:rw
    secrets:
      - db_password
      - credentials
    restart: unless-stopped

  nginx:
    build:
      context: ./requirements/nginx
    image: nginx:inception
    env_file: .env
    depends_on:
      - wordpress
    networks:
      - inception_net
    ports:
      - 443:443
    volumes:
      - wordpress_data:/var/www/html:ro
    restart: unless-stopped

networks:
  inception_net:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/haito/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/haito/data/wordpress

secrets:
  db_password: 
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
