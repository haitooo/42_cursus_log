server {
    listen 127.0.0.1:8080;
    # server_name default_server;

    client_max_body_size 10240;
    error_page 404 www/404_custom.html;

    location / {
        root ./www;
        index index.html;
        methods GET POST DELETE;
    }

    location /readonly {
        root ./www;
        methods GET;
    }
    
    location /subdir {
        root ./www/subdir;
        index subdir_index.html;
        methods GET POST DELETE;
    }

    location /autoindex_on {
        root ./www/autoindex_on;
        methods GET;
        autoindex on;
    }

    location /autoindex_off {
        root ./www/autoindex_off;
        methods GET;
        autoindex off;
    }

    location /autoindex_priority {
        root ./www/autoindex_priority;
        methods GET;
        autoindex on;
        index index.html;
    }

    location /autoindex_xss {
        root ./www/autoindex_xss;
        methods GET;
        autoindex on;
    }
    
    location /no_permission_dir {
        root ./www/no_permission_dir;
        methods GET;
        autoindex on;
    }
    
    location /no_permission_index {
        root ./www/no_permission_index;
        methods GET;
        index index.html;
    }

    location /upload {
        root ./www/upload;
        methods POST GET;
        upload_store ./www/upload;
        client_max_body_size 1048576;
    }

    location /no_store {
        root ./www/uploads;
        methods POST;
    }
    
    location /no_permission_upload {
        root ./www/no_permission_upload;
        methods POST;
        upload_store ./www/no_permission_upload;
    }

    location /delete_dir {
        root ./www/delete_dir;
        methods DELETE;
    }

    location /no_permission_delete_dir {
        root ./www/no_permission_delete_dir;
        methods DELETE;
    }

    location /redirect301 {
        methods GET;
        return 301 http://example.com/new_place;
    }

    location /redirect302 {
        methods GET;
        return 302 /relative_target;
    }

    # 6. CGI
    location /cgi-bin {
        root ./www/cgi-bin;
        methods GET POST;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }
}

