	<h1>SITE-B</h1>
	<p>The site on port 8081. Its root is <code>./www/site-b</code> — a
	different document root from the one port 8080 serves.</p>
	<p>This location has <code>autoindex on</code>, so a directory with no
	index file is listed instead of refused.</p>
	<ul>
		<li><a href="/notes/">/notes/</a> — a directory with no index file</li>
		<li><a href="/sample.txt">/sample.txt</a></li>
		<li><a href="http://127.0.0.1:8080/">SITE-A (port 8080)</a></li>
	</ul>
