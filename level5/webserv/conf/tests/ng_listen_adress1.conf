server {
    listen 256.0.0.1:8080;

    root ./www;
    index index.html;

    client_max_body_size 1048576;

    error_page 404 ./errors/404.html;

    location / {
        methods GET POST DELETE;
        autoindex off;
    }

    location /upload {
        methods POST;
        upload_store ./uploads;
    }

    location /cgi-bin {
        methods GET POST;
        root ./cgi-bin;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }
}
