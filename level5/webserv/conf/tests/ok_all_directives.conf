server {
    listen 127.0.0.1:8080;
    root ./www;
    index index.html;
    client_max_body_size 1048576;
    error_page 404 ./errors/404.html;
    error_page 500 ./errors/500.html;

    location / {
        methods GET;
        root ./www;
        index home.html;
        autoindex off;
    }

    location /upload {
        methods POST;
        upload_store ./uploads;
    }

    location /files {
        methods GET DELETE;
        root ./storage;
        autoindex on;
    }

    location /cgi-bin {
        methods GET POST;
        root ./cgi-bin;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }

    location /old {
        methods GET;
        return 301 /new;
    }
}
